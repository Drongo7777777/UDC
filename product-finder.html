<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDC Parts - Поиск запчастей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .search-section {
            padding: 30px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #764ba2;
        }

        .photo-search {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .photo-search label {
            display: inline-block;
            padding: 10px 20px;
            background: #764ba2;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .photo-search label:hover {
            background: #667eea;
        }

        .photo-search input[type="file"] {
            display: none;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .results-section {
            padding: 30px 20px;
        }

        .results-info {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-4px);
            border-color: #667eea;
        }

        .product-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            line-height: 1.4;
        }

        .product-details {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .detail-item {
            margin-bottom: 8px;
        }

        .detail-label {
            font-weight: 600;
            color: #333;
        }

        .detail-value {
            color: #666;
            word-break: break-word;
        }

        .product-links {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .buy-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .buy-btn.amazon {
            background: #FF9900;
            color: white;
        }

        .buy-btn.amazon:hover {
            background: #FF7700;
        }

        .buy-btn.walmart {
            background: #0071CE;
            color: white;
        }

        .buy-btn.walmart:hover {
            background: #00558C;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-results svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            color: #999;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }

            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 UDC Parts</h1>
            <p>Поиск запчастей по номеру детали, модели или фото</p>
        </div>

        <div class="search-section">
            <div class="search-container">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('search')">По номеру/модели</div>
                    <div class="tab" onclick="switchTab('photo')">По фото</div>
                </div>

                <div id="search-tab" class="tab-content">
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Введите номер детали (041-0178-00), модель (MZ Magnum) или SKU..."
                            onkeyup="handleSearch()"
                        >
                        <button onclick="handleSearch()">Поиск</button>
                    </div>
                </div>

                <div id="photo-tab" class="tab-content" style="display: none;">
                    <div class="photo-search">
                        <label>
                            📸 Выбрать фото
                            <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload()">
                        </label>
                        <p style="color: #666; margin-top: 10px; font-size: 14px;">
                            Загрузите фото детали или мотора с видимым номером модели
                        </p>
                        <div id="photoLoading" style="display: none;">
                            <div class="spinner"></div>
                            <p>Анализирую фото...</p>
                        </div>
                    </div>
                </div>

                <div class="filters">
                    <button class="filter-btn" onclick="filterByType('')">Все</button>
                    <button class="filter-btn" onclick="filterByType('Belt')">Ремни</button>
                    <button class="filter-btn" onclick="filterByType('Blade')">Ножи</button>
                    <button class="filter-btn" onclick="filterByType('Spindle')">Шпиндели</button>
                    <button class="filter-btn" onclick="filterByType('Pulley')">Шкивы</button>
                </div>
            </div>
        </div>

        <div class="results-section">
            <div class="results-info" id="resultsInfo"></div>
            <div class="products-grid" id="resultsContainer"></div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let currentFilter = '';
        let currentSearchTerm = '';

        // Загружаем продукты
        async function loadProducts() {
            try {
                const response = await fetch('./products.json');
                allProducts = await response.json();
                console.log(`Загружено товаров: ${allProducts.length}`);
                handleSearch();
            } catch (error) {
                console.error('Ошибка загрузки товаров:', error);
                document.getElementById('resultsInfo').textContent = 'Ошибка загрузки данных';
            }
        }

        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            currentSearchTerm = searchTerm;
            filterResults();
        }

        function filterByType(type) {
            currentFilter = type;
            
            // Обновляем кнопки фильтра
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            filterResults();
        }

        function filterResults() {
            let filtered = allProducts;

            // Фильтр по типу
            if (currentFilter) {
                filtered = filtered.filter(p => p.type === currentFilter);
            }

            // Поиск по термину
            if (currentSearchTerm) {
                filtered = filtered.filter(product => {
                    const searchFields = [
                        product.model,
                        product.sku,
                        product.oem,
                        product.title,
                        product.compatible_models,
                        product.oem_replacement,
                        product.type
                    ].join(' ').toLowerCase();
                    
                    return searchFields.includes(currentSearchTerm);
                });
            }

            displayResults(filtered);
        }

        function displayResults(products) {
            const container = document.getElementById('resultsContainer');
            const info = document.getElementById('resultsInfo');

            if (products.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div>😞</div>
                        <h3>Товаров не найдено</h3>
                        <p>Попробуйте изменить поисковый запрос или фильтры</p>
                    </div>
                `;
                info.textContent = '';
                return;
            }

            info.textContent = `Найдено товаров: ${products.length}`;

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-type">${product.type}</div>
                    <div class="product-title">${product.title || product.model}</div>
                    
                    <div class="product-details">
                        ${product.oem_replacement ? `
                            <div class="detail-item">
                                <span class="detail-label">OEM №:</span>
                                <span class="detail-value">${product.oem_replacement}</span>
                            </div>
                        ` : ''}
                        
                        ${product.model ? `
                            <div class="detail-item">
                                <span class="detail-label">Модель:</span>
                                <span class="detail-value">${product.model}</span>
                            </div>
                        ` : ''}

                        ${product.sku ? `
                            <div class="detail-item">
                                <span class="detail-label">SKU:</span>
                                <span class="detail-value">${product.sku}</span>
                            </div>
                        ` : ''}

                        ${product.compatible_models ? `
                            <div class="detail-item">
                                <span class="detail-label">Совместимость:</span>
                                <span class="detail-value">${product.compatible_models}</span>
                            </div>
                        ` : ''}
                    </div>

                    <div class="product-links">
                        <a href="https://www.amazon.com/s?k=${encodeURIComponent(product.sku)}" target="_blank" class="buy-btn amazon">
                            🛒 Amazon
                        </a>
                        <a href="https://www.walmart.com/search/?query=${encodeURIComponent(product.sku)}" target="_blank" class="buy-btn walmart">
                            🛒 Walmart
                        </a>
                    </div>
                </div>
            `).join('');
        }

        async function handlePhotoUpload() {
            const input = document.getElementById('photoInput');
            const file = input.files[0];
            
            if (!file) return;

            const loading = document.getElementById('photoLoading');
            loading.style.display = 'block';

            try {
                // Читаем файл как base64
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const base64 = e.target.result.split(',')[1];
                    
                    // Используем Claude API для распознавания текста на фото
                    try {
                        const response = await fetch('https://api.anthropic.com/v1/messages', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-api-key': 'YOUR_API_KEY_HERE' // Будет заменена на клиента
                            },
                            body: JSON.stringify({
                                model: 'claude-opus-4-1-20250805',
                                max_tokens: 1024,
                                messages: [{
                                    role: 'user',
                                    content: [
                                        {
                                            type: 'image',
                                            source: {
                                                type: 'base64',
                                                media_type: 'image/jpeg',
                                                data: base64
                                            }
                                        },
                                        {
                                            type: 'text',
                                            text: 'Найди все номера моделей, OEM номера и коды на этом изображении. Выведи только номера и коды, разделенные пробелами.'
                                        }
                                    ]
                                }]
                            })
                        });

                        const data = await response.json();
                        const text = data.content[0].text;
                        document.getElementById('searchInput').value = text;
                        handleSearch();

                    } catch (error) {
                        console.error('Ошибка Claude API:', error);
                        alert('Требуется API ключ для поиска по фото. Используйте обычный поиск.');
                    }

                    loading.style.display = 'none';
                };
                reader.readAsDataURL(file);

            } catch (error) {
                console.error('Ошибка:', error);
                loading.style.display = 'none';
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').style.display = 'block';
        }

        // Загружаем товары при загрузке страницы
        window.onload = loadProducts;
    </script>
</body>
</html>
